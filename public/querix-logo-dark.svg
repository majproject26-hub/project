<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="qLogoDarkRing" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#F7F4E8" />
      <stop offset="55%" stop-color="#DCE4C2" />
      <stop offset="100%" stop-color="#A4B774" />
    </linearGradient>
    <linearGradient id="qLogoDarkSwoosh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F4E8" />
      <stop offset="45%" stop-color="#DCE4C2" />
      <stop offset="100%" stop-color="#748447" />
    </linearGradient>
  </defs>

  <!-- Main Q Outer Ring -->
  <path
    d="M 68 67.5
       A 36 36 0 1 1 76.5 53
       L 66.5 50.5
       A 25.5 25.5 0 1 0 60 63.5
       Z"
    fill="url(#qLogoDarkRing)"
  />

  <!-- 3 Ascending Analytical Bars -->
  <rect x="32.5" y="44" width="6.5" height="18" rx="1.5" fill="#DCE4C2" />
  <rect x="42.5" y="32" width="6.5" height="30" rx="1.5" fill="#DCE4C2" />
  <rect x="52.5" y="20" width="6.5" height="42" rx="1.5" fill="#DCE4C2" />

  <!-- Dynamic Q Tail Swoosh -->
  <path
    d="M 45 64
       C 54 58, 68 56, 76 65
       C 80 69, 86 74, 94 75
       C 85 81, 74 80, 64 73
       C 56 67, 50 66, 45 64
       Z"
    fill="url(#qLogoDarkSwoosh)"
  />
</svg>
